name: Build ResQMesh APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME).
      # We only make sure the pieces we need are present; no extra setup action is used.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ResQMesh-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-build-reports
          path: |
            core/build/reports/tests
            app/build/reports
          if-no-files-found: ignore
